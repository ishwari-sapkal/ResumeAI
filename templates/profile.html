<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile | ResumeAI</title>

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- EXISTING DASHBOARD CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- PROFILE CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/profile.css') }}">

</head>

<body>

<!-- ==================================================
     DASHBOARD WRAPPER
================================================== -->

<div class="dashboard">


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="logo">

            Resume<span>AI</span>

        </div>


        <nav>

            <button
                type="button"
                onclick="window.location.href='/dashboard'">

                <i class="fas fa-table-columns"></i>

                Dashboard

            </button>


            <button
                type="button"
                onclick="window.location.href='/my-resume'">

                <i class="fas fa-file-lines"></i>

                My Resume

            </button>


            <button
                type="button"
                onclick="window.location.href='/templates'">

                <i class="fas fa-layer-group"></i>

                Templates

            </button>


            <button
                type="button"
                class="active">

                <i class="fas fa-user"></i>

                Profile

            </button>


            <button
                type="button"
                class="logout"
                onclick="logoutUser()">

                <i class="fas fa-right-from-bracket"></i>

                Logout

            </button>

        </nav>

    </aside>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main class="dashboard-main">


        <!-- ==================================================
             PAGE HEADER
        ================================================== -->

        <section class="welcome">

            <div>

                <h1>
                    Profile
                </h1>

                <p>
                    Manage your personal information and account password.
                </p>

            </div>

        </section>



        <!-- ==================================================
             PROFILE INFORMATION
        ================================================== -->

        <section class="profile-card">


            <div class="profile-header">

                <div class="profile-avatar">

                    {% if user.name %}

                        {{ user.name[0]|upper }}

                    {% else %}

                        U

                    {% endif %}

                </div>


                <div>

                    <h2>

                        {{ user.name|default("User") }}

                    </h2>

                    <p>

                        ResumeAI User

                    </p>

                </div>

            </div>



            <!-- ==================================================
                 UPDATE PROFILE FORM
            ================================================== -->

            <form
                action="{{ url_for('update_profile') }}"
                method="POST"
                class="profile-form">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">

                        Full Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user.name|default('') }}"
                        placeholder="Enter your full name"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email|default('') }}"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">

                        Phone Number

                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ user.phone|default('') }}"
                        placeholder="Enter your phone number">

                </div>



                <!-- CREATED DATE -->





                <!-- UPDATE PROFILE -->

                <div class="profile-actions">

                    <button
                        type="submit"
                        class="update-btn">

                        <i class="fas fa-user-pen"></i>

                        Update Profile

                    </button>

                </div>


            </form>

        </section>



        <!-- ==================================================
             PASSWORD CARD
        ================================================== -->

        <section class="profile-card">


            <div class="card-heading">

                <h2>

                    Update Password

                </h2>

                <p>

                    Change your account password securely.

                </p>

            </div>



            <!-- ==================================================
                 PASSWORD FORM
            ================================================== -->

            <form
                action="{{ url_for('update_password') }}"
                method="POST"
                class="profile-form password-form">


                <!-- CURRENT PASSWORD -->

                <div class="form-group full-width">

                    <label for="currentPassword">

                        Current Password

                    </label>


                    <div class="password-field">

                        <input
                            type="password"
                            id="currentPassword"
                            name="currentPassword"
                            placeholder="Enter your current password"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'currentPassword',
                                this
                            )">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">

                        New Password

                    </label>


                    <div class="password-field">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            minlength="6"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'newPassword',
                                this
                            )">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">

                        Confirm Password

                    </label>


                    <div class="password-field">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your new password"
                            minlength="6"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'confirmPassword',
                                this
                            )">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- UPDATE PASSWORD -->

                <div class="profile-actions">

                    <button
                        type="submit"
                        class="password-btn">

                        <i class="fas fa-lock"></i>

                        Update Password

                    </button>

                </div>


            </form>

        </section>


    </main>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


// ==================================================
// PASSWORD VISIBILITY
// ==================================================

function togglePassword(inputId, button){

    const input = document.getElementById(inputId);

    const icon = button.querySelector("i");


    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }
    else{

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}


// ==================================================
// LOGOUT
// ==================================================

function logoutUser(){

    const confirmLogout = confirm(
        "Are you sure you want to logout?"
    );


    if(confirmLogout){

        window.location.href = "/logout";

    }

}


</script>


</body>

</html>
